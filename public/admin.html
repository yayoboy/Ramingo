<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramingo CMS - Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #333; }
        .card {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 14px;
        }
        .command {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <h1>⚙️ Ramingo CMS - Admin Panel</h1>

    <div class="card">
        <h2>🚧 Admin Panel Not Built Yet</h2>
        <p>The React admin panel hasn't been compiled yet.</p>
        <p>To set up the admin panel, run:</p>
        <div class="command">
            cd admin<br>
            npm install<br>
            npm run dev
        </div>
        <p>Then access the development server at <code>http://localhost:5173</code></p>
    </div>

    <p style="text-align: center;">
        <a href="/" style="color: #0066cc;">&larr; Back to Home</a>
    </p>
</body>
</html>
