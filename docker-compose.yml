version: '3.8'

services:
  # Ramingo CMS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ramingo-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Mount storage for persistent data
      - ./storage:/var/www/html/storage
      - ./data:/var/www/html/data
      - ./public/uploads:/var/www/html/public/uploads
      # Mount source code for development (comment out for production)
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./api:/var/www/html/api
      - ./themes:/var/www/html/themes
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
    networks:
      - ramingo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Admin Panel Development Server (optional - for development only)
  admin:
    image: node:18-alpine
    container_name: ramingo-admin
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./admin:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    networks:
      - ramingo-network
    depends_on:
      - app

networks:
  ramingo-network:
    driver: bridge

volumes:
  storage:
  data:
  uploads:
